name: Build Android APK (DLSS 5 Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm ci
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap init "DLSS 5 Mobile" "com.stringai.dlss5" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Configure Android Manifest Permissions
        run: |
          # Inject SYSTEM_ALERT_WINDOW & POST_NOTIFICATIONS into AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
