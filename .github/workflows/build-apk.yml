name: Build Android APK (DLSS 5 Mobile)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: bun install

      - name: Build Web Production Assets
        run: bun run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Configure Android Manifest Permissions
        run: |
          # Inject permissions into AndroidManifest.xml safely if not already present
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' "$MANIFEST"
          fi

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlss5-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
